openapi: 3.0.3
info:
  title: Controle de Despesas — Resumo por período (M3)
  version: 0.1.0
paths:
  /resumo:
    get:
      operationId: getExpenseSummary
      summary: Resumo de despesas no período
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Início inclusivo; default = início do mês atual
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Fim inclusivo; default = fim do mês atual
        - name: preset
          in: query
          schema:
            type: string
            enum: [current_month, previous_month, custom]
      responses:
        "200":
          description: Resumo do usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSummary"
        "400":
          description: Período inválido
        "401":
          description: Não autenticado
components:
  schemas:
    Category:
      type: string
      enum: [ALIMENTACAO, TRANSPORTE, MORADIA, SAUDE, LAZER, EDUCACAO, OUTROS]
    CategoryBreakdown:
      type: object
      required: [category, totalAmountCents, percentage]
      properties:
        category:
          $ref: "#/components/schemas/Category"
        totalAmountCents:
          type: integer
          minimum: 0
        percentage:
          type: number
          description: Uma casa decimal
    ExpenseSummary:
      type: object
      required: [from, to, totalAmountCents, expenseCount, byCategory]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalAmountCents:
          type: integer
          minimum: 0
        expenseCount:
          type: integer
          minimum: 0
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdown"
